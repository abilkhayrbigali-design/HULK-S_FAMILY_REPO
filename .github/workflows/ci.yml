name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-and-contracts:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install '${{ matrix.python-version }}'
      - run: uv sync --project backend --locked --python '${{ matrix.python-version }}'
      - run: make check
      - name: Start API and probe database health
        shell: bash
        run: |
          uv run --project backend --locked uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-access-log &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          curl --fail --retry 15 --retry-delay 1 --retry-connrefused http://127.0.0.1:8000/health
  backend-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and probe backend container
        shell: bash
        run: |
          trap 'docker compose -f compose.api.yaml down --volumes' EXIT
          docker compose -f compose.api.yaml up --build --wait --wait-timeout 180
          curl --fail http://127.0.0.1:8000/health
          curl --fail --silent --output /dev/null http://127.0.0.1:8000/api/v1/checklists
          curl --fail --silent --output /dev/null http://127.0.0.1:8000/openapi.json
  frontend:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
      CQA_TEST_BACKEND: "1"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --project ../backend --locked
      - run: npm ci
      - run: npm run build
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
